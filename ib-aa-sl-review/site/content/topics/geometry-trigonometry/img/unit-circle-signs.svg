<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Signs of sin, cos and tan in each quadrant</title><desc id="d">Unit circle on x and y axes. Quadrant I: sin, cos, tan positive. Quadrant II: sin positive, cos and tan negative. Quadrant III: tan positive, sin and cos negative. Quadrant IV: cos positive, sin and tan negative. The circle meets the axes at 0 or 2π, π/2, π and 3π/2.</desc><rect width="640" height="480" rx="18" fill="#f7f4ed"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14304f"/></marker></defs><circle cx="320" cy="240" r="160" fill="#fff" stroke="#00478e" stroke-width="3"/><line x1="60" y1="240" x2="595" y2="240" stroke="#14304f" stroke-width="2.2" marker-end="url(#ar)"/><line x1="320" y1="462" x2="320" y2="22" stroke="#14304f" stroke-width="2.2" marker-end="url(#ar)"/><text x="604.0" y="246.0" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" font-style="italic" text-anchor="start" fill="#14304f">x</text><text x="330.0" y="24.0" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" font-style="italic" text-anchor="start" fill="#14304f">y</text><circle cx="480" cy="240" r="5" fill="#00478e"/><circle cx="320" cy="80" r="5" fill="#00478e"/><circle cx="160" cy="240" r="5" fill="#00478e"/><circle cx="320" cy="400" r="5" fill="#00478e"/><text x="492.0" y="228.0" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" font-style="normal" text-anchor="start" fill="#14304f">0</text><text x="492.0" y="268.0" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" font-style="normal" text-anchor="start" fill="#14304f">2π</text><text x="348.0" y="54.0" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" fo