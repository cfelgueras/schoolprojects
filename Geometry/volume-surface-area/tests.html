<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Formula Tests</title>
  <meta name="description" content="Checks every area and volume formula of the app.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300478e'/%3E%3Cpath d='M4 4L28 28M28 4L4 28' stroke='%23ddaf71' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="css/app.css?v=1">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" defer></script>
  <!-- import maps for older browsers (Safari < 16.4) -->
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.8.2/dist/es-module-shims.js"></script>
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <div class="bar" aria-hidden="true"></div>
  <div class="wrap">
    <div class="topbar"><div class="titles"><p class="crumb"><a href="./">← Volume &amp; Surface Area</a></p><h1>Formula <em>tests</em></h1></div></div>
    <p class="summary" id="summary">Running…</p>
    <ul class="tests" id="tests"></ul>
  </div>
  <script type="module">
    import { run } from "./js/tests.js";
    const results = run();
    const bad = results.filter((r) => !r.ok);
    document.getElementById("summary").textContent = bad.length ? bad.length + " of " + results.length + " tests failed" : "All " + results.length + " tests passed";
    document.getElementById("tests").innerHTML = results.map((r) =>
      `<li class="${r.ok ? "ok" : "bad"}">${r.name}${r.ok ? "" : ` — got ${r.got}, expected ${r.want}`}</li>`).join("");
    document.title = bad.length ? "FAIL" : "PASS";
  </script>
</body>
</html>
